services:
  zookeeper:

    image: confluentinc/cp-zookeeper:7.4.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:

    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - hueca-net

  postgres_db:
    image: postgres:17-alpine
    environment:

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    networks:
      - hueca-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup2210.unknown:/tmp/backup.pgdump
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    environment:

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092

    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    ports:
      - "3002:3002"
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    environment:

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    ports:
      - "3003:3003"
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    environment:

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    ports:
      - "3004:3004"
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard-service:
    build:
      context: ../services/dashboard-service
      dockerfile: Dockerfile
    ports:
      - "3010:3010"
    environment:

      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  report-service:
    build: ../services/report-service
    ports:
      - "3011:3011"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres_db
      POSTGRES_PORT: 5432
    volumes:
      - ../services/report-service:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - hueca-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  hueca-net:
    driver: bridge

volumes:
  postgres_data: